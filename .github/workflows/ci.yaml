name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify hooks
    runs-on: ubuntu-latest
    # The suite is shell and finishes in seconds; past this it is a hang, and a
    # hang must report as a failure rather than as six hours of runner.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The gate derives ids from git history, and version.sh counts commits —
      # a shallow clone would make both of them measure the clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash plugins/bughunter/hooks/gate-test.sh
      - run: bash plugins/bughunter/hooks/codex-router-test.sh
      - run: bash scripts/version.sh --self-test
      # The manifest carries the version a marketplace reads, so it is the one
      # thing here that is wrong silently: nothing breaks, the plugin just
      # never appears to update.
      - run: bash scripts/version.sh --check

  hygiene:
    name: Public-repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The positive control first: the guard proves it bites before it is
      # trusted with the real inputs.
      - run: bash scripts/public-hygiene.sh --self-test
      - run: bash scripts/public-hygiene.sh --files
      # Only the commits this PR adds. main carries one historical subject the
      # guard would refuse; that one is the owner's to rewrite or keep, and a
      # check over all of history would be permanently red for it.
      - if: github.event_name == 'pull_request'
        run: bash scripts/public-hygiene.sh --commits "origin/${{ github.base_ref }}..HEAD"
      # Title and body through the environment, never interpolated into the
      # shell: a PR body is text a stranger wrote.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/public-hygiene.sh --text -
