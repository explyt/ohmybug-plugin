name: CI

on:
  # `edited` too: the hygiene job reads the PR title and body, and a body
  # edited after a green push would otherwise never be checked.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify hooks
    runs-on: ubuntu-latest
    # The suite is shell and finishes in seconds; past this it is a hang, and a
    # hang must report as a failure rather than as six hours of runner.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The gate derives ids from git history, and version.sh counts commits —
      # a shallow clone would make both of them measure the clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash plugins/bughunter/hooks/gate-test.sh
      # The router test executes the skill's watch loop under zsh – the shell
      # Claude Code runs it in on macOS – and fails, not skips, without it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: bash plugins/bughunter/hooks/codex-router-test.sh
      # The scan must read a payload under a multibyte locale; its test fails,
      # not skips, when a locale is missing, so generate the ones it runs under.
      - run: |
          sudo localedef -i ja_JP -f EUC-JP ja_JP.eucJP
          sudo localedef -i zh_CN -f GBK zh_CN.GBK
          sudo localedef -i en_US -f ISO-8859-1 en_US.ISO8859-1
      - run: bash plugins/bughunter/hooks/secret-scan-test.sh
      - run: bash plugins/bughunter/hooks/version-check-test.sh
      - run: bash scripts/version.sh --self-test
      # The manifest carries the version a marketplace reads, so it is the one
      # thing here that is wrong silently: nothing breaks, the plugin just
      # never appears to update.
      - run: bash scripts/version.sh --check

  mod:
    name: Claude Code mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Pinned: the mod API is early access and moves between releases, so a
      # new release is a deliberate bump here, not a surprise on a Tuesday.
      - run: npm install -g @anthropic-ai/claude-code@2.1.288
      - run: claude plugin validate plugins/bughunter
      - run: claude plugin test plugins/bughunter
      - run: bash scripts/load-check.sh --mod "$(command -v claude)"
      # Older clients validate plugin.json strictly; a key they do not know
      # refuses the whole plugin, shell gate included.
      - run: npx -y @anthropic-ai/claude-code@2.1.140 plugin validate plugins/bughunter
      # Validate does not open the hooks files the manifest lists; these older
      # clients parse each one as a classic hooks file and mark the whole
      # plugin "failed to load" when it is not. Only a real load sees that.
      - run: |
          for v in 2.0.77 2.1.140; do
            npm install --silent --prefix "$RUNNER_TEMP/cc-$v" "@anthropic-ai/claude-code@$v"
            bash scripts/load-check.sh --self-test "$RUNNER_TEMP/cc-$v/node_modules/.bin/claude"
            bash scripts/load-check.sh "$RUNNER_TEMP/cc-$v/node_modules/.bin/claude"
          done

  hygiene:
    name: Public-repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The positive control first: the guard proves it bites before it is
      # trusted with the real inputs.
      - run: bash scripts/public-hygiene.sh --self-test
      - run: bash scripts/public-hygiene.sh --files
      # Only the commits this PR adds. main carries one historical subject the
      # guard would refuse; that one is the owner's to rewrite or keep, and a
      # check over all of history would be permanently red for it.
      - if: github.event_name == 'pull_request'
        run: bash scripts/public-hygiene.sh --commits "origin/${{ github.base_ref }}..HEAD"
      # Title and body through the environment, never interpolated into the
      # shell: a PR body is text a stranger wrote.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/public-hygiene.sh --text -
